name: Build Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: FastDLX.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: FastDLX
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish single-file executable
      shell: bash
      run: |
        dotnet publish FastDLX.csproj -c Release -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:EnableCompressionInSingleFile=true \
          -p:DebugType=none \
          -p:DebugSymbols=false \
          -o publish

    - name: Verify output
      shell: bash
      run: |
        if [ ! -f "publish/${{ matrix.exe }}" ]; then
          echo "Build failed - publish/${{ matrix.exe }} not found"
          exit 1
        fi
        ls -lh "publish/${{ matrix.exe }}"
