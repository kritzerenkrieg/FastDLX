name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0
      - 'v*.*'    # Also accepts v1.0 format
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: FastDLX.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: FastDLX
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract version from tag
      id: get_version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" =~ ^refs/tags/v(.*)$ ]]; then
          version="${BASH_REMATCH[1]}"
        else
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' FastDLX.csproj | head -n1)
        fi
        echo "VERSION=$version" >> "$GITHUB_OUTPUT"
        echo "Building version: $version"

    - name: Publish single-file executable
      shell: bash
      run: |
        dotnet publish FastDLX.csproj -c Release -r ${{ matrix.rid }} \
          --self-contained true \
          -p:Version=${{ steps.get_version.outputs.VERSION }} \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:EnableCompressionInSingleFile=true \
          -p:DebugType=none \
          -p:DebugSymbols=false \
          -o publish

    - name: Package release artifacts
      shell: bash
      run: |
        mkdir -p release
        v="${{ steps.get_version.outputs.VERSION }}"
        if [ "${{ matrix.rid }}" = "win-x64" ]; then
          cp publish/FastDLX.exe release/FastDLX.exe
          (cd publish && 7z a -tzip "../release/FastDLX-v${v}-win-x64-portable.zip" FastDLX.exe)
        else
          chmod +x publish/FastDLX
          cp publish/FastDLX release/FastDLX-linux-x64
          tar -czf "release/FastDLX-v${v}-linux-x64.tar.gz" -C publish FastDLX
        fi
        ls -lh release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.rid }}
        path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release
        merge-multiple: true

    - name: Extract version
      id: get_version
      run: |
        if [[ "$GITHUB_REF" =~ ^refs/tags/v(.*)$ ]]; then
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
        else
          echo "VERSION=dev" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        body: |
          ## FastDLX v${{ steps.get_version.outputs.VERSION }}

          Fast download manager for Source engine game servers with FastDL support.

          ### Download
          **Windows (x64)**
          - `FastDLX.exe` - run directly, no installation needed
          - `FastDLX-v${{ steps.get_version.outputs.VERSION }}-win-x64-portable.zip`

          **Linux (x64)**
          - `FastDLX-linux-x64` - `chmod +x FastDLX-linux-x64 && ./FastDLX-linux-x64`
          - `FastDLX-v${{ steps.get_version.outputs.VERSION }}-linux-x64.tar.gz`

          ### Features
          - **Multi-game support**: Counter-Strike: Source, CS:GO, Team Fortress 2, Left 4 Dead 2, Garry's Mod
          - **Smart sync options**: Download all content, skip maps, or sync only maps
          - Resume interrupted downloads automatically
          - Automatic game directory detection (Windows and Linux Steam, incl. Flatpak/Snap)
          - Server presets and custom server support
          - Progress tracking and detailed logging
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
